# A tag v* publishes the gem to RubyGems with trusted publishing, after the
# tests. A tag with a hyphen (v0.2.0-rc.1) is a pre-release: the gem version
# 0.2.0.rc.1. The same shape as lognorth-sdk-ts.
name: Release
on:
  push:
    tags: ['v*']

# Read only by default: only the job that publishes can write.
permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
          bundler-cache: true
      - run: bundle exec rake test
      # The tag v0.2.0-rc.1 releases the gem version 0.2.0.rc.1, which RubyGems treats as a prerelease.
      - run: |
          version=$(ruby -e 'print Gem::Specification.load("lognorth.gemspec").version')
          test "$version" = "$(echo "${GITHUB_REF_NAME#v}" | tr - .)"
      - uses: rubygems/release-gem@v1
